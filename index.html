<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sizing-game</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div id="object-name">Loading…</div>
    <div id="round">Round 1 · Total 0</div>
  </header>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hint">Drag the object to spin it · Drag the person up/down to resize</div>
    <div id="loading">Loading model…</div>
  </div>

  <div id="controls">
    <label for="size">Person size</label>
    <input id="size" type="range" min="-3" max="2" step="0.01" value="0">
    <div id="guess">The object is <b>1.7 m</b> tall</div>
    <button id="lock">Lock in</button>
  </div>

  <div id="result" hidden>
    <div id="score"></div>
    <div id="detail"></div>
    <div id="fact"></div>
    <button id="next">Next object</button>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
