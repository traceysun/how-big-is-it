<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sizing-game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1 id="object-name">…</h1>
    <div id="round">round 1</div>
  </header>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="guess">about <b>1.7 m</b> tall</div>
    <div id="hint">spin the object · drag the person up or down until they look the right size</div>
    <div id="loading">loading…</div>
  </div>

  <footer>
    <div id="controls">
      <button id="lock">lock in</button>
    </div>
    <div id="result" hidden>
      <div id="score"></div>
      <div id="detail"></div>
      <div id="fact"></div>
      <button id="next">next →</button>
    </div>
  </footer>

  <script type="module" src="game.js?v=3"></script>
</body>
</html>
